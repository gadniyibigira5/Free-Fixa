<!DOCTYPE html>
<html>
<head>
    <title>Login - Freefixa</title>
    <link rel="icon" href="gad.jpg">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-box {
            background: white;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid green;
        }
        .form-box h2 {
            color: green;
            margin-bottom: 25px;
            border-left: 4px solid green;
            padding-left: 15px;
            text-align: left;
        }
        .form-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .form-box button {
            background: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .form-box button:hover { background: darkgreen; }
        .demo-note {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .form-box a { color: green; text-decoration: none; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { height: 60px; }
    </style>
</head>
<body>
    <div class="form-box">
        <div class="logo-container">
            <img src="logo.jpg" alt="Freefixa">
        </div>
        <h2>🔐 Login to Your Account</h2>
        
        <div class="demo-note">
            ⚠️ Demo Mode: Use any email/password to preview.<br>
            Full authentication requires PHP & Database.
        </div>
        
        <form onsubmit="alert('🎉 Demo Login Successful! Welcome to Freefixa Marketplace.'); window.location.href='index.html'; return false;">
            <input type="email" placeholder="📧 Email Address" value="demo@freefixa.com" required>
            <input type="password" placeholder="🔒 Password" value="demo123" required>
            <button type="submit">Login</button>
        </form>
        
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p><a href="index.html">← Back to Home</a></p>
    </div>
</body>
</html>
